allprojects {
    repositories {
        google()  // Asegúrate de tener esto aquí
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

buildscript {
    repositories {
        google()  // Asegúrate de tener este repositorio
        mavenCentral()
    }
    dependencies {
        // Asegúrate de añadir el classpath del plugin de Google Services
        classpath 'com.google.gms:google-services:4.3.15'  // Añade esta línea (ajusta la versión si es necesario)
    }
}
